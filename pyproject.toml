[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "petracer"
version = "0.1.0"
description = "Lightweight Windows malware behaviour sandbox (Wine + bubblewrap + API hooks)"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "PeTracer contributors" }]

[project.urls]
Homepage = "https://github.com/Yuiii-owo/PeTracer"

[project.scripts]
petracer = "petracer.cli:main"

[tool.setuptools]
packages = ["petracer", "petracer.detect"]

[tool.setuptools.package-data]
petracer = ["agent/*.c"]
